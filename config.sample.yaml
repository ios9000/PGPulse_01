# PGPulse — Sample Configuration
# Copy to pgpulse.yml and customize for your environment.
#
# Quick-start (no config file needed):
#   pgpulse-server --target "postgres://user:pass@host:5432/postgres"

server:
  # listen: ":8989"     # HTTP listen address (override with --listen)
  # port: 8989          # HTTP port (alternative to listen)
  log_level: info        # debug, info, warn, error

# Storage — leave empty for live mode (in-memory, 2h retention)
# storage:
#   dsn: "postgres://pgpulse:CHANGE_ME@localhost:5432/pgpulse?sslmode=disable"
#   use_timescaledb: true
#   retention_days: 30

# Authentication — disabled by default; requires storage.dsn
# auth:
#   enabled: true
#   jwt_secret: "your-secret-key-at-least-32-characters-long"
#   initial_admin:
#     username: admin
#     password: CHANGE_ME  # hashed on startup; change immediately

# Alerting — disabled by default; requires storage.dsn
# alerting:
#   enabled: true
#   default_channels: [email]
#   email:
#     host: smtp.example.com
#     port: 587
#     from: pgpulse@example.com
#     recipients: [dba@example.com]

# Monitored PostgreSQL instances
instances:
  - id: my-postgres
    name: "My PostgreSQL"
    dsn: "postgres://pgpulse_monitor:CHANGE_ME@localhost:5432/postgres?sslmode=disable"
    # enabled: true
    # max_conns: 5
    # os_metrics_method: sql   # sql, agent, disabled
    #   How OS metrics (CPU, memory, load, disk I/O) are collected for this instance.
    #   Overrides the global os_metrics.method; if neither is set the default is "sql".
    #   sql      — reads /proc/* (and /etc/hostname, /etc/os-release) on the monitored
    #              host via pg_read_file(). The monitoring role then needs
    #              pg_read_server_files plus EXECUTE on pg_read_file(text), which lets it
    #              read ANY file the postgres OS user can read (data files, configs,
    #              keys). Widest blast radius. PGPulse logs a WARN at startup in this mode.
    #   agent    — polls the separate pgpulse-agent over HTTP (agent_url, port 9187).
    #              The monitoring role needs only pg_monitor; the agent reads procfs as
    #              its own OS user, outside PostgreSQL.
    #   disabled — no OS metrics; the monitoring role needs only pg_monitor.
    #   Details: docs/security/VETTING.md
